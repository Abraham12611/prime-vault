[package]
name = "prime-vault-stylus"
version = "0.1.0"
edition = "2021"

[dependencies]
stylus-sdk = "0.6.0"
stylus-proc = "0.6.0"
alloy-primitives = { version = "0.8.0", default-features = false }
alloy-sol-types = { version = "0.8.0", default-features = false }
mini-alloc = "0.6.0"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
